[project]
name = "brand-inbox"
version = "0.1.0"
description = "Sorts a creator's brand-deal inbox: categories, deal terms, risk flags, next steps and draft replies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
inbox = "inbox_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inbox_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
